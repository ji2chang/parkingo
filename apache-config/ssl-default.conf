# Configurazione HTTPS con certificati mkcert
<VirtualHost *:443>
    DocumentRoot /var/www/html
    ServerName prova
    
    SSLEngine on
    SSLCertificateFile /etc/ssl/mkcert/cert.pem
    SSLCertificateKeyFile /etc/ssl/mkcert/key.pem
    
    SSLProtocol all -SSLv2 -SSLv3 -TLSv1 -TLSv1.1
    SSLCipherSuite HIGH:!aNULL:!MD5
    SSLHonorCipherOrder on
    
    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        DirectorySlash Off
    </Directory>

    # Alias: /api/* → api/index.php (Slim gestisce il routing interno)
    <Directory /var/www/html/api>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    RewriteEngine On

    # Instrada tutte le richieste /api/* verso api/index.php senza 301
    RewriteCond %{REQUEST_URI} ^/api
    RewriteRule ^(.*)$ /var/www/html/api/index.php [L]

    # Log files per SSL
    ErrorLog ${APACHE_LOG_DIR}/ssl_error.log
    CustomLog ${APACHE_LOG_DIR}/ssl_access.log combined
    
    # PHP configuration
    <FilesMatch \.php$>
        SetHandler application/x-httpd-php
    </FilesMatch>
</VirtualHost>
