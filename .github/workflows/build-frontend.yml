name: Build Frontend (DEVFRONT)

on:
  push:
    branches: [ 'DEVFRONT' ]
  workflow_dispatch:

jobs:
  build:
    name: Build frontend and upload artifact
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: |
          cd frontend
          npm ci

      - name: Build
        run: |
          cd frontend
          npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      # Optional: if you want to automatically copy the built files into `www/frontend`
      # and push them back to the repo, you can add steps using a personal access token
      # with repo write permissions. This example is intentionally commented out because
      # it modifies the repository on CI which may not be desired.
