services:
  # Servizio Apache + PHP
  web:
    build:
      context: ./apache-php
      dockerfile: Dockerfile
      # Configurazione proxy opzionale
      # Decommentare le seguenti tre righe e configurare se necessario:
      # args:
        # PROXY_HOST: "host.docker.internal"  # o l'IP della macchina host
        # PROXY_PORT: "8888"                  # porta del proxy
    container_name: parkingo
    ports:
      - "9080:80"
      - "9443:443"
    volumes:
      - ./www:/var/www/html
      - ./apache-config:/etc/apache2/sites-available
    networks:
      - parking_network
    depends_on:
      - database
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html

  # Servizio MariaDB
  database:
    image: mariadb:10.11
    container_name: parking_db
    restart: always
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d
    networks:
      - parking_network
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: parking_db
      MYSQL_USER: parking_user
      MYSQL_PASSWORD: parkingpassword

  # Servizio Composer
  composer:
    image: composer:2.6
    container_name: parking_composer
    working_dir: /var/www/html
    volumes:
      - ./www:/var/www/html
    depends_on:
      - web
    networks:
      - parking_network
    command: ["composer", "--version"]

networks:
  parking_network:

volumes:
  db_data:
